<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/logo.png" />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="%VITE_STORE_DESCRIPTION%" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%VITE_STORE_NAME% - %VITE_STORE_TAGLINE%" />
    <meta property="og:description" content="%VITE_STORE_DESCRIPTION%" />
    <meta name="twitter:card" content="summary" />
    <title>%VITE_STORE_NAME% - %VITE_STORE_TAGLINE%</title>
    <script>
      (function () {
        var stored = localStorage.getItem('%VITE_STORE_SLUG%'.replace(/-/g, '_') + '_theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored === 'dark' || (!stored && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
